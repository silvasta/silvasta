[project]
name = "sstcore-py"
version = "0.4.0a1"
description = "Generalized Function and Tools combined as Project Setup Boost"
readme = "README.md"
authors = [{ name = "silvan", email = "silvasta3@gmail.com" }]
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
keywords = [
  # ---  Descriptors & Features ---
  "system-bootstrap",
  "config-management",
  "cli-framework",
  "terminal-ui",
  "utils",
  # ---  Ecosystem & Libraries ---
  "pydantic",
  "loguru",
  "rich",
  "typer",
  "textual",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "fire>=0.7.1",
  "loguru>=0.7.3",
  "msgspec>=0.22.0",
  "pydantic-settings>=2.16.1",
  "pydantic>=2.14.1",
  "rich>=15.0.0",
  "send2trash>=2.1.0",
  "textual>=8.2.8",
  "typer>=0.27.3",
]

[project.scripts]
sst = "sstcore.__main__:main"
sstcore-py = "sstcore.__main__:main" # invoked on uvx

[project.urls]
Repository = "https://github.com/silvasta/silvasta"

[tool.uv.build-backend]
module-name = "sstcore"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"


[dependency-groups]
dev = ["pre-commit>=4.6.0", "pytest>=9.0.3", "ruff>=0.15.12", "ty>=0.0.44"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ty.src]
include = ["src", "examples"]
exclude = [
  # Match all files/dirs starting with 3+ underscores anywhere
  "**/____*",
  # Specific directory branches (if you prefer explicit paths)
  # "src/sstcore/brick/field/___ideas",
]

[tool.ruff]
line-length = 80
exclude = ["tests"]
extend-exclude = [
  "tests",
  # Catch any file or folder starting with 3+ underscores
  "**/____*",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
select = [
  "B",  # flake8-bugbear
  "D",  # docstrings
  "E",  # pycodestyle errors
  "F",  # Pyflakes
  "I",  # isort
  "N",  # pep8-naming
  "UP", # pyupgrade
]

ignore = [
  "N999", # Disable invalid module name checks
  "E501", # Line length
  # --- The "Don't Force Me to Write Comments" Rules ---
  # Code  # coun # importance # description
  "D104", #   6  #  5  # Missing docstring in public package
  "D100", #  33  #  4  # Missing docstring in public module
  "D101", #  63  #  5  # Missing docstring in public class
  "D107", #  21  #  3  # Missing docstring in __init__
  "D103", #  43  #  3  # Missing docstring in public function
  "D102", # 125  #  2  # Missing docstring in public method
  "D106", #   0  #  1  # Missing docstring in public nested class
  "D105", #  38  #  1  # Missing docstring in magic method

  # --- The "Stop Micromanaging My Punctuation" Rules ---
  "D400", # First line must end with a period
  "D415", # First line must end with a period, question mark, or exclamation point

  # --- Aesthetic Preferences & Layout Adjustments ---
  "D212", # Multi-line docstring summary should start at the first line

  # --- Conflict Resolution (Mandatory for Ruff Formatter compatibility) ---
  "D203", # One-blank-line-before-class (Conflicts with D211)
  "D202", # No blank lines allowed after function docstring
]

# LATER: use this to filter
